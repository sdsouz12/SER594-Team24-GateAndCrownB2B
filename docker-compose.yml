version: '3.9'

services:
  postgres:
    image: ankane/pgvector:v0.7.0
    restart: unless-stopped
    environment:
      POSTGRES_DB: gate_crown
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gate_crown"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./backend-service/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/gate_crown
      AI_SERVICE_URL: http://ai-service:8001
      FRONTEND_URL: http://localhost:3000
      ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build:
      context: ./AI-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - ./AI-service/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/gate_crown
      AI_SERVICE_PORT: "8001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
